services:
  api:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/storage/data
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - gumshuda-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  gumshuda-storage:
